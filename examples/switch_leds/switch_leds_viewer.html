<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スイッチで LED の模様を流す（leds.c）</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f1f2f6; --panel: #ffffff; --inset: #eceef3; --inset-hover: #dfe3ea;
  --fg: #1b1e26; --dim: #596072; --wire: #7b8294;
  --accent: #e07a10; --accent-ink: #a65200; --accent-soft: #fdebd3;
  --recirc: #2f86c4; --recirc-ink: #1d5f8f; --recirc-soft: #d9ebf7;
  --led: #f5b800; --led-off: #c9cdd6;
  --bit1: #3d62b6; --bit1-ink: #ffffff; --bit0: #e4e7ee; --bit0-ink: #4d5464;
  --hl: #ffefc2; --focus: #1f6feb;
  --mono: Consolas, "BIZ UDGothic", "MS Gothic", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161b; --panel: #1e222a; --inset: #282d37; --inset-hover: #343a47;
    --fg: #e4e7ee; --dim: #9ba2b3; --wire: #6f778a;
    --accent: #ff9a2e; --accent-ink: #ffb061; --accent-soft: #43311b;
    --recirc: #4ea3e0; --recirc-ink: #8cc8f2; --recirc-soft: #1c3449;
    --led: #ffd246; --led-off: #4a4f5c;
    --bit1: #5b83dd; --bit1-ink: #0e1116; --bit0: #2a2f3a; --bit0-ink: #aab1c2;
    --hl: #40371f; --focus: #6ea8ff;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  font-size: 14px; line-height: 1.5;
}
.wrap { max-width: 1840px; margin: 0 auto; padding: 16px 20px 28px; }
.top { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-end; justify-content: space-between; }
h1 { font-size: 20px; line-height: 1.3; margin: 0; }
.sub { margin: 2px 0 0; color: var(--dim); font-size: 13px; }
.choices { display: flex; flex-wrap: wrap; gap: 10px 20px; }
.seg { border: 0; padding: 0; margin: 0; min-width: 0; }
.seg legend { font-size: 12px; color: var(--dim); padding: 0; margin-bottom: 4px; }
.seg .opts { display: inline-flex; flex-wrap: wrap; background: var(--inset); border-radius: 9px; padding: 3px; gap: 3px; }
.seg label { position: relative; display: block; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg span { display: block; padding: 5px 12px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.seg input:checked + span { background: var(--panel); font-weight: 700; box-shadow: 0 1px 2px rgba(0, 0, 0, .28); }
.seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 1px; }

.transport {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 0 10px;
}
.transport .buttons { display: flex; gap: 6px; }
.transport button {
  font: inherit; min-width: 60px; padding: 6px 12px; border: 0; border-radius: 8px;
  background: var(--inset); color: var(--fg); cursor: pointer;
}
.transport button:hover:not(:disabled) { background: var(--inset-hover); }
.transport button:disabled { opacity: .45; cursor: default; }
.transport button:focus-visible, .code li:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.transport #bPlay { background: var(--bit1); color: var(--bit1-ink); font-weight: 700; min-width: 72px; }
.transport input[type=range] { flex: 1 1 240px; min-width: 160px; accent-color: var(--accent); }
.transport output { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.transport .keys { color: var(--dim); font-size: 12px; white-space: nowrap; }
@media (max-width: 1199px) { .transport .keys { display: none; } }

.explain {
  background: var(--panel); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px;
  display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 4px 28px;
}
.tag { display: block; font-size: 12px; color: var(--dim); }
.explain code { font-family: var(--mono); font-size: 16px; font-weight: 700; white-space: pre-wrap; overflow-wrap: anywhere; }
.explain .lineno { font-size: 13px; color: var(--accent-ink); font-weight: 700; margin-right: 10px; white-space: nowrap; }
.explain p { margin: 0; font-size: 15px; }
.explain .meta { margin-top: 4px; font-size: 12px; color: var(--dim); }
.explain .delta { font-family: var(--mono); color: var(--accent-ink); font-weight: 700; }

.grid { display: grid; gap: 14px; align-items: start; grid-template-columns: minmax(0, 1fr); grid-template-areas: "circuit" "regs" "source"; }
@media (min-width: 1000px) {
  .grid { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-areas: "source circuit" "source regs"; }
}
@media (min-width: 1500px) {
  .grid { grid-template-columns: minmax(0, 30fr) minmax(0, 45fr) minmax(380px, 25fr); grid-template-areas: "source circuit regs"; }
}
.panel { background: var(--panel); border-radius: 12px; padding: 12px 14px 14px; min-width: 0; }
.panel h2 { font-size: 13px; color: var(--dim); margin: 0 0 8px; font-weight: 700; }
.panel h2 small { font-weight: 400; font-size: 12px; margin-left: 8px; }
#pSource { grid-area: source; } #pCircuit { grid-area: circuit; } #pRegs { grid-area: regs; }

.code {
  margin: 0; padding: 0; list-style: none; overflow-x: auto;
  display: grid; grid-template-columns: minmax(max-content, 1fr);
  font-family: var(--mono); font-size: clamp(12px, 0.78vw + 0.5px, 13.5px); line-height: 1.5; tab-size: 4;
}
@media (min-width: 1000px) {
  .code { max-height: max(300px, calc(100vh - 330px)); overflow-y: auto; }
  #pSource { position: sticky; top: 62px; }
}
.code li { display: flex; white-space: pre; border-radius: 4px; }
.code .ln { flex: 0 0 2.6em; text-align: right; padding-right: 12px; color: var(--dim); user-select: none; }
.code .tx { flex: 1 0 auto; padding-right: 10px; }
.code .cm { color: var(--dim); }
.code li.run { cursor: pointer; }
.code li.run .ln { color: var(--fg); font-weight: 700; }
.code li.run:hover { background: var(--inset); }
.code li.cur, .code li.cur:hover { background: var(--hl); }
.code li.cur .ln { color: var(--accent-ink); }
.hint { margin: 8px 0 0; font-size: 12px; color: var(--dim); }

.regs { border-collapse: separate; border-spacing: 0 3px; font-size: 13px; }
.regs th, .regs td { padding: 2px 3px; white-space: nowrap; text-align: left; }
.regs thead th { font-size: 11px; color: var(--dim); font-weight: 400; text-align: center; }
.regs thead th:first-child, .regs thead th:nth-child(2) { text-align: left; }
.regs tbody th { font-family: var(--mono); font-weight: 700; padding-left: 8px; border-radius: 6px 0 0 6px; }
.regs .val { font-family: var(--mono); padding-right: 8px; }
.regs td:last-child { padding-right: 6px; border-radius: 0 6px 6px 0; }
.regs tr.chg th, .regs tr.chg td { background: var(--accent-soft); }
.bit {
  display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center;
  border-radius: 5px; font-family: var(--mono); font-size: 13px; background: var(--bit0); color: var(--bit0-ink);
}
.bit.one { background: var(--bit1); color: var(--bit1-ink); font-weight: 700; }
.bit.none { background: transparent; color: var(--dim); opacity: .7; }
.bit.mark { box-shadow: 0 0 0 2px var(--fg); }
.bit.flip { outline: 2px solid var(--accent); outline-offset: 2px; }
.bit.mark.flip { outline-offset: 3px; }

/* circuit drawings */
.cirbox { overflow-x: auto; }
#cir { display: block; width: 100%; min-width: 480px; height: auto; max-height: 600px; }
#cir text { font-family: inherit; fill: var(--fg); font-size: 17px; }
#cir text.big { font-size: 19px; }
#cir text.small { font-size: 14.5px; }
#cir text.dim, #cir tspan.dim { fill: var(--dim); }
#cir text.em { fill: var(--accent-ink); font-weight: 700; }
#cir .wire path { fill: none; stroke: var(--wire); stroke-width: 2; }
#cir .wire path.ctl { stroke-dasharray: 4 3; stroke-width: 1.5; }
#cir .body { fill: var(--inset); stroke: var(--fg); stroke-width: 1.5; }
#cir .box { fill: var(--panel); stroke: var(--wire); stroke-width: 1; }
#cir .mod { fill: none; stroke: var(--wire); stroke-width: 1.5; stroke-dasharray: 6 4; }
#cir .comp { fill: var(--panel); stroke: var(--fg); stroke-width: 2.5; }
#cir .dot { fill: var(--fg); }
#cir .plate { stroke: var(--fg); stroke-width: 2.5; }
#cir .plate.thick { stroke-width: 6; }
#cir .gate { stroke: var(--wire); stroke-width: 2; }
#cir .sw .lever { stroke: var(--dim); stroke-width: 3; stroke-linecap: round; transform: rotate(32deg); transition: transform .18s ease; }
#cir .sw.on .lever { transform: rotate(0deg); stroke: var(--fg); }
#cir .cur { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
#cir .cur.re { stroke: var(--recirc); }
#cir .cur.gen { stroke: var(--recirc); stroke-dasharray: 10 8; stroke-width: 4; opacity: .8; }
#cir .flow { fill: none; stroke: #ffffff; stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 0.1 52; animation: flow 1.3s linear infinite; }
#cir .flow.gen { stroke-width: 3; }
#cir use.ah { fill: var(--fg); }
@keyframes flow { to { stroke-dashoffset: -52.1; } }
@media (prefers-reduced-motion: reduce) { #cir .flow { animation: none; } #cir .sw .lever { transition: none; } }
#cir .led-body { fill: var(--led-off); stroke: var(--fg); stroke-width: 1.5; stroke-linejoin: round; }
#cir .led-bar { stroke: var(--fg); stroke-width: 3; }
#cir .halo { fill: var(--led); opacity: 0; }
#cir[data-lit="1"] .led-body, #cir .ledg.lit .led-body { fill: var(--led); }
#cir[data-lit="1"] .halo, #cir .ledg.lit .halo { opacity: .3; }

/* character LCD */
.lcd { display: inline-block; background: #7fa650; border-radius: 10px; padding: 14px 16px; box-shadow: inset 0 0 0 3px rgba(0, 0, 0, .25); max-width: 100%; overflow-x: auto; }
.lcd.off { background: #5e6b55; }
.lcd .row { display: flex; gap: 3px; }
.lcd .row + .row { margin-top: 4px; }
.lcd .ch {
  flex: 0 0 auto; width: 1.3em; height: 1.85em; display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, .1); color: #142208; font-family: var(--mono); font-size: clamp(15px, 1.4vw, 22px); font-weight: 700; border-radius: 2px;
}
.lcd .ch.cur { box-shadow: inset 0 -3px 0 #142208; }
.bus { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.bus .line { display: grid; justify-items: center; gap: 2px; background: var(--inset); border-radius: 8px; padding: 4px 8px; }
.bus .line b { font-size: 12px; }
.bus .line small { font-size: 11px; color: var(--dim); }
.lcdlog { margin: 10px 0 0; padding-left: 20px; font-size: 13px; color: var(--dim); }
.lcdlog li.now { color: var(--accent-ink); font-weight: 700; }
#cir[data-wire="source"] .w-sink, #cir[data-wire="sink"] .w-source { display: none; }
#cir .motor { fill: var(--panel); stroke: var(--fg); stroke-width: 2.5; }
#cir .motor.on { fill: var(--accent-soft); }
#cir .spin { fill: none; stroke: var(--accent-ink); stroke-width: 2.5; stroke-linecap: round; }

/* pins view */
.pins { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 6px; }
.pin { background: var(--inset); border-radius: 8px; padding: 6px 9px; display: grid; grid-template-columns: auto 1fr; gap: 0 8px; }
.pin b { font-family: var(--mono); }
.pin .no { color: var(--dim); font-size: 12px; text-align: right; }
.pin .dir { font-size: 12px; color: var(--dim); }
.pin .lv { font-family: var(--mono); font-weight: 700; text-align: right; }
.pin.out .dir { color: var(--fg); }
.pin.hi { background: var(--accent-soft); }
.pin.hi .lv { color: var(--accent-ink); }
.pin.chg { outline: 2px solid var(--accent); outline-offset: 1px; }

.status { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin: 8px 0 0; }
.status:empty { display: none; }
.status div { background: var(--inset); border-radius: 8px; padding: 6px 9px; min-width: 0; }
.status dt { font-size: 11px; color: var(--dim); }
.status dd { margin: 0; font-weight: 700; font-size: 13px; overflow-wrap: anywhere; }
.status .on { background: var(--accent-soft); }
.status .on dd { color: var(--accent-ink); }
.status .re { background: var(--recirc-soft); }
.status .re dd { color: var(--recirc-ink); }
.flowtext { margin: 10px 0 0; font-size: 14px; min-height: 3em; }
.flowtext:empty { min-height: 0; }
.wave { margin: 10px 0 0; background: var(--inset); border-radius: 8px; padding: 8px 10px 6px; }
.wave + .wave { margin-top: 6px; }
.wave .head { margin: 0 0 4px; font-size: 12px; color: var(--dim); }
.wave svg { display: block; width: 100%; height: 44px; }
.wave polyline { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; }
.wave .cap { margin: 4px 0 0; font-size: 12px; }
.assume { margin: 6px 0 0; font-size: 12px; color: var(--dim); }
.foot { margin-top: 16px; color: var(--dim); font-size: 12px; }
.foot ul { margin: 0; padding-left: 18px; }
.foot li { margin: 2px 0; }
@media (max-width: 560px) { .explain { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">PIC viewer</h1>
      <p class="sub" id="subtitle"></p>
    </div>
    <div class="choices" id="choices">
      <fieldset class="seg" id="targetSeg">
        <legend>マイコン</legend>
        <div class="opts" id="targetOpts"></div>
      </fieldset>
    </div>
  </header>

  <section class="transport" aria-label="ステップ操作">
    <div class="buttons">
      <button type="button" id="bFirst">最初</button>
      <button type="button" id="bPrev">前へ</button>
      <button type="button" id="bPlay" aria-pressed="false">再生</button>
      <button type="button" id="bNext">次へ</button>
      <button type="button" id="bLast">最後</button>
    </div>
    <input type="range" id="slider" min="0" max="1" step="1" value="0" aria-label="ステップ">
    <output id="stepLabel" for="slider"></output>
    <span class="keys">左右キーで前後、スペースキーで再生と停止</span>
  </section>

  <section class="explain" aria-live="polite">
    <div>
      <span class="tag">このステップで実行した行</span>
      <span class="lineno" id="exNo"></span><code id="exCode"></code>
    </div>
    <div>
      <span class="tag">起きたこと</span>
      <p id="exNote"></p>
      <div class="meta"><span id="exDelta"></span></div>
      <div class="meta" id="exMeta"></div>
    </div>
  </section>

  <main class="grid">
    <section class="panel" id="pSource" aria-label="ソースコード">
      <h2>ソースコード<small id="srcName"></small></h2>
      <ol class="code" id="code"></ol>
      <p class="hint">行番号が濃い行は、記録の中で止まった行。クリックすると、その行を実行した直後のステップへ移る。</p>
    </section>

    <section class="panel" id="pCircuit" aria-label="回路">
      <h2><span id="cirTitle">回路</span><small id="cirSub"></small></h2>
      <div class="cirbox" id="cirBox"></div>
      <dl class="status" id="cirStatus"></dl>
      <p class="flowtext" id="cirText"></p>
      <div id="waveBox" hidden></div>
      <p class="assume" id="cirAssume"></p>
    </section>

    <section class="panel" id="pRegs" aria-label="レジスタ">
      <h2>レジスタ<small>シミュレータで読んだ値</small></h2>
      <table class="regs">
        <thead>
          <tr><th scope="col">名前</th><th scope="col">値</th>
            <th scope="col">7</th><th scope="col">6</th><th scope="col">5</th><th scope="col">4</th>
            <th scope="col">3</th><th scope="col">2</th><th scope="col">1</th><th scope="col">0</th></tr>
        </thead>
        <tbody id="regBody"></tbody>
      </table>
      <p class="hint" id="regHint"></p>
    </section>
  </main>

  <footer class="foot"><ul id="foot"></ul></footer>
</div>

<script>
window.PicViewer = { circuits: {}, util: {} };
/* leds: one LED (with its resistor) on each pin of a port, and an optional push switch on an input pin. */
(() => {
  'use strict';

  const COL0 = 230;      // x of the first LED column
  const DX = 62;         // spacing of the columns
  const RAIL = 290;      // y of the common rail under the LEDs

  function columns(t, cfg) {
    const port = String(cfg.port || 'C').toUpperCase();
    if (Array.isArray(cfg.bits) && cfg.bits.length) return { port, bits: cfg.bits.map(Number) };
    const tris = t.regs.find((r) => r.name === 'TRIS' + port);
    const bits = [];
    for (let b = 7; b >= 0; b--) if (!tris || (tris.mask >> b) & 1) bits.push(b);
    return { port, bits };
  }

  function drawing(t, cfg, U) {
    const { port, bits } = columns(t, cfg);
    const high = cfg.active !== 'low';
    const sw = cfg.switch && U.portBit(cfg.switch.pin) ? cfg.switch : null;
    const right = COL0 + (bits.length - 1) * DX + 50;
    const svg = U.svgEl('svg', { id: 'cir', viewBox: `0 0 ${Math.max(right + 30, 560)} 330`, role: 'img', 'aria-label': `${port} の LED の回路` });
    const add = (tag, attrs, text) => { const e = U.svgEl(tag, attrs); if (text !== undefined) e.textContent = text; svg.append(e); return e; };
    const defs = U.svgEl('defs');
    defs.append(U.svgEl('path', { id: 'ah', d: 'M-6 -6.5 L7 0 L-6 6.5 Z' }));
    svg.append(defs);
    const wires = add('g', { class: 'wire' });
    const wire = (d) => wires.append(U.svgEl('path', { d }));
    add('g', { id: 'gCur' });
    add('rect', { class: 'body', x: COL0 - 40, y: 24, width: right - COL0 + 20, height: 68, rx: 6 });
    add('text', { x: COL0 - 32, y: 46, class: 'small', 'font-weight': '700' }, `${t.device}  PORT${port}`);
    wire(`M${(sw ? 30 : COL0 - 40)} ${RAIL} H${right}`);
    add('text', { class: 'dim small', x: right - 120, y: RAIL + 22 }, high ? 'GND (0 V) の線' : `+${t.vdd || 5} V の線`);
    bits.forEach((b, i) => {
      const cx = COL0 + i * DX;
      const name = `R${port}${b}`;
      add('text', { class: 'small', x: cx, y: 84, 'text-anchor': 'middle' }, name);
      add('text', { class: 'dim small', x: cx, y: 110, 'text-anchor': 'middle' }, `${U.pinsWith(t, name).join('、')} 番`);
      wire(`M${cx} 92 V118 M${cx} 162 V188 M${cx} 216 V${RAIL}`);
      add('circle', { class: 'dot', cx, cy: 92, r: 4 });
      add('rect', { class: 'comp', x: cx - 8, y: 118, width: 16, height: 44, rx: 2 });
      const g = add('g', { class: 'ledg', 'data-bit': String(b) });
      g.append(U.svgEl('circle', { class: 'halo', cx, cy: 202, r: 20 }));
      g.append(U.svgEl('path', { class: 'led-body', d: high ? `M${cx - 13} 190 H${cx + 13} L${cx} 212 Z` : `M${cx - 13} 214 H${cx + 13} L${cx} 192 Z` }));
      g.append(U.svgEl('line', { class: 'led-bar', x1: cx - 13, x2: cx + 13, y1: high ? 214 : 190, y2: high ? 214 : 190 }));
    });
    add('text', { class: 'dim small', x: COL0 - 32, y: RAIL + 22 }, `各 LED に抵抗 ${cfg.r_ohm || 330} Ω`);
    if (sw) {
      const pb = U.portBit(sw.pin);
      const up = sw.active !== 'low';      // switch to the supply with a pull-down, or to GND with a pull-up
      add('text', { class: 'small', x: 22, y: 20 }, up ? `+${t.vdd || 5} V` : 'GND');
      wire(`M60 26 V40 M60 72 V150 M60 150 H150 V60 H${COL0 - 40} M60 150 V180 M60 224 V${RAIL}`);
      add('circle', { class: 'dot', cx: COL0 - 40, cy: 60, r: 4 });
      const g = add('g', { class: 'sw', id: 'swBtn' });
      g.append(U.svgEl('line', { class: 'lever', x1: 60, y1: 72, x2: 60, y2: 40, style: 'transform-origin:60px 72px' }));
      g.append(U.svgEl('circle', { class: 'dot', cx: 60, cy: 40, r: 3.5 }));
      g.append(U.svgEl('circle', { class: 'dot', cx: 60, cy: 72, r: 3.5 }));
      add('circle', { class: 'dot', cx: 60, cy: 150, r: 4 });
      add('rect', { class: 'comp', x: 52, y: 180, width: 16, height: 44, rx: 2 });
      add('text', { class: 'small', x: 76, y: 60 }, 'スイッチ');
      add('text', { class: 'dim small', x: 76, y: 206 }, up ? 'プルダウン' : 'プルアップ');
      add('text', { class: 'small', x: 76, y: 142 }, `${sw.pin}  ${U.pinsWith(t, sw.pin).join('、')} 番`);
      svg.dataset.swPort = pb.port;
    }
    return svg;
  }

  window.PicViewer.circuits.leds = {
    title: '回路と電流',
    options: [],
    setup(ctx) {
      const { t, cfg, box, U } = ctx;
      const { port, bits } = columns(t, cfg);
      box.append(drawing(t, cfg, U));
      const high = cfg.active !== 'low';
      const marks = bits.flatMap((b) => ['TRIS', 'PORT', 'LAT'].map((p) => ({ reg: p + port, bit: b })));
      const sw = cfg.switch && U.portBit(cfg.switch.pin);
      if (sw) marks.push({ reg: 'PORT' + sw.port, bit: sw.bit });
      return {
        sub: 'LED と抵抗とスイッチのつなぎ方は仮定',
        assume: `LED は ${high ? 'ピンが 1 のとき（ピンから抵抗、LED を通って GND へ）' : 'ピンが 0 のとき（電源から LED、抵抗を通ってピンへ）'}点灯する。`
          + (sw ? `スイッチは押すと ${cfg.switch.pin} が ${cfg.switch.active === 'low' ? '0' : '1'} になる。` : ''),
        regHint: `太い枠のビットが LED${sw ? 'とスイッチ' : ''}のピン。`,
        marks,
        foot: ['LED、抵抗、スイッチのつなぎ方は仮定。実際の基板に合わせて circuit の値を直す。'],
      };
    },
    update(ctx) {
      const { t, cfg, box, R, U } = ctx;
      const svg = box.querySelector('#cir');
      if (!svg) return {};
      const { port, bits } = columns(t, cfg);
      const high = cfg.active !== 'low';
      const latch = U.latchOf(R, port);
      const tris = R['TRIS' + port];
      if (latch === undefined || tris === undefined) {
        return { text: `TRIS${port} と PORT${port}（または LAT${port}）を registers に入れると LED が描ける。` };
      }
      const g = svg.querySelector('#gCur');
      g.replaceChildren();
      const lit = [];
      bits.forEach((b, i) => {
        const out = ((tris >> b) & 1) === 0;
        const on = out && ((latch >> b) & 1) === (high ? 1 : 0);
        svg.querySelector(`.ledg[data-bit="${b}"]`).classList.toggle('lit', on);
        if (on) {
          lit.push(`R${port}${b}`);
          const cx = COL0 + i * DX;
          U.drawPath(g, [[cx, 92], [cx, RAIL]], '', { arrows: high ? [[cx, 174, 90], [cx, 252, 90]] : [[cx, 174, -90], [cx, 252, -90]] });
        }
      });
      let pressed = null;
      if (cfg.switch && svg.dataset.swPort) {
        const pb = U.portBit(cfg.switch.pin);
        const level = R['PORT' + pb.port] !== undefined ? (R['PORT' + pb.port] >> pb.bit) & 1 : null;
        if (level !== null) pressed = level === (cfg.switch.active === 'low' ? 0 : 1);
        svg.querySelector('#swBtn').classList.toggle('on', Boolean(pressed));
      }
      const pattern = bits.reduce((acc, b) => acc + (((latch >> b) & 1) ? '1' : '0'), '');
      const status = [
        { label: `PORT${port} の出力`, value: `${U.hex(latch)}（${pattern}）`, tone: lit.length ? 'on' : '' },
        { label: '点灯', value: `${lit.length} 個`, tone: lit.length ? 'on' : '' },
      ];
      if (pressed !== null) status.push({ label: 'スイッチ', value: pressed ? '押している' : '離している', tone: pressed ? 'on' : '' });
      const swText = pressed === null ? '' : pressed ? 'スイッチは押してある。' : 'スイッチは離してある。';
      return {
        status,
        text: (lit.length ? `点灯している LED: ${lit.join('、')}。` : 'LED は全部消えている。') + swText,
        probe: { pattern, lit: lit.length, pressed },
      };
    },
  };
})();

/* pins: the default view. Direction and value of every port pin, from TRISx and PORTx / LATx. */
(() => {
  'use strict';

  function pinNames(t, cfg) {
    if (Array.isArray(cfg.pins) && cfg.pins.length) return cfg.pins.map((p) => String(p).toUpperCase());
    const out = [];
    t.regs.forEach((r) => {
      const m = /^TRIS([A-Z])$/.exec(r.name);
      if (!m) return;
      for (let b = 0; b < 8; b++) if ((r.mask >> b) & 1) out.push(`R${m[1]}${b}`);
    });
    return out;
  }

  window.PicViewer.circuits.pins = {
    title: 'ピン',
    options: [],
    setup(ctx) {
      const { t, cfg, box, U } = ctx;
      const names = pinNames(t, cfg).filter((n) => U.portBit(n));
      if (!names.length) {
        box.append(U.el('p', 'hint', 'ピンを出すには、TRISx と PORTx（または LATx）を registers に入れる。'));
        return {};
      }
      const grid = U.el('div', 'pins');
      names.forEach((name) => {
        const card = U.el('div', 'pin');
        card.dataset.pin = name;
        const no = U.pinsWith(t, name);
        card.append(U.el('b', '', name), U.el('span', 'no', no.length ? `${no.join('、')} 番` : ''),
          U.el('span', 'dir', ''), U.el('span', 'lv', ''));
        grid.append(card);
      });
      box.append(grid);
      return {
        sub: 'TRIS と PORT / LAT から見た、各ピンの向きと値',
        assume: 'TRIS のビットが 0 なら出力、1 なら入力。値は PORT のビット（PORT を読んでいなければ LAT）。オレンジの枠は直前のステップから変わったピン。',
      };
    },
    update(ctx) {
      const { box, R, P, U } = ctx;
      const outs = [];
      box.querySelectorAll('.pin').forEach((card) => {
        const pb = U.portBit(card.dataset.pin);
        const read = (regs, prefix) => (regs && regs[prefix + pb.port] !== undefined ? (regs[prefix + pb.port] >> pb.bit) & 1 : null);
        const level = (regs) => { const v = read(regs, 'PORT'); return v !== null ? v : read(regs, 'LAT'); };
        const dir = read(R, 'TRIS');
        const lv = level(R);
        card.classList.toggle('out', dir === 0);
        card.classList.toggle('hi', lv === 1);
        card.classList.toggle('chg', Boolean(P) && (read(P, 'TRIS') !== dir || level(P) !== lv));
        card.querySelector('.dir').textContent = dir === null ? '?' : (dir ? '入力' : '出力');
        card.querySelector('.lv').textContent = lv === null ? '?' : String(lv);
        if (dir === 0) outs.push(`${card.dataset.pin} = ${lv}`);
      });
      return { text: outs.length ? `出力のピン: ${outs.join('、')}` : '出力のピンは無い（すべて入力）。', probe: { outputs: outs } };
    },
  };
})();

/* PIC viewer core: step controls, source, registers and explanation.

(() => {

  const PLAY_MS = 1400;
  const $ = (id) => document.getElementById(id);
  const S = { t: 0, step: 0, opts: {}, timer: null, probe: null };

  // ---------------- helpers, also used by the circuits
  const el = (tag, cls, text) => {

    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const svgEl = (tag, attrs = {}) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);

  const num = (v, d = 1) => Number(v).toFixed(d);
  const hex = (v) => '0x' + v.toString(16).toUpperCase().padStart(2, '0');
  const pinsWith = (t, fn) => {

    const out = [];
    t.pins.forEach((names, i) => { if (names.some((n) => n.toUpperCase() === f)) out.push(i + 1); });

  };

  // a current path: an orange line, moving dots, and arrows (explicit [x, y, angle] or along long segments)
  function drawPath(g, pts, cls, opt = {}) {

    g.append(svgEl('path', { class: 'cur ' + cls, d }));

  // ---------------- data helpers
  const tgt = () => D.targets[S.t];
  const last = () => tgt().steps.length - 1;
  const circuitOf = (t) => PV.circuits[t.circuit.type] || PV.circuits.pins;
  const isCounter = (t, name) => t.counters.indexOf(name) >= 0;
  const instrHz = (t) => (t.fosc_hz ? t.fosc_hz / 4 : null);
  const bitName = (r, b) => r.bits[b] || `${r.name}<${b}>`;
  const codeOf = (line) => { const i = line.indexOf('//'); return (i < 0 ? line : line.slice(0, i)).trim(); };
  const fmtTime = (s) => (s < 1e-3 ? `${num(s * 1e6, 1)} µs` : s < 1 ? `${num(s * 1e3, 3)} ms` : `${num(s, 3)} 秒`);

  function regsAt(t, step) {
    const R = {};
    if (step) t.regs.forEach((r, i) => { R[r.name] = step.v[i]; });
    return R;
  }

  function changedBits(t, st, prev) {
    const out = [];
    if (!prev) return out;
    t.regs.forEach((r, i) => {
      if (isCounter(t, r.name)) return;
      const diff = (prev.v[i] ^ st.v[i]) & r.mask;
      for (let b = 7; b >= 0; b--) {
        if ((diff >> b) & 1) out.push({ name: bitName(r, b), from: (prev.v[i] >> b) & 1, to: (st.v[i] >> b) & 1 });
      }
    });
    return out;
  }

  // ---------------- one-time and per-target building
  function buildTargets() {
    const box = $('targetOpts');
    box.replaceChildren();
    D.targets.forEach((t, i) => {
      const label = el('label');
      const input = el('input');
      input.type = 'radio'; input.name = 'target'; input.value = String(i); input.checked = i === S.t;
      input.addEventListener('change', () => { S.t = i; stop(); buildTarget(); });
      label.append(input, el('span', '', t.device));
      box.append(label);
    });
  }

  function buildOptions(c) {
    document.querySelectorAll('#choices .seg.opt').forEach((n) => n.remove());
    (c.options || []).forEach((o) => {
      if (!o.choices.some((ch) => ch.value === S.opts[o.key])) S.opts[o.key] = o.default || o.choices[0].value;
      const fs = el('fieldset', 'seg opt');
      fs.append(el('legend', '', o.legend));
      const box = el('div', 'opts');
      o.choices.forEach((ch) => {
        const label = el('label');
        const input = el('input');
        input.type = 'radio'; input.name = 'opt-' + o.key; input.value = ch.value; input.checked = S.opts[o.key] === ch.value;
        input.addEventListener('change', () => { S.opts[o.key] = ch.value; update(); });
        label.append(input, el('span', '', ch.label));
        box.append(label);
      });
      fs.append(box);
      $('choices').append(fs);
    });
  }

  function buildSource(t) {
    const ran = new Set(t.steps.map((s) => s.exec).filter((n) => n !== null));
    const code = $('code');
    code.replaceChildren();
    t.source.forEach((line, i) => {
      const no = i + 1;
      const li = el('li');
      li.dataset.line = String(no);
      const tx = el('span', 'tx');
      const cut = line.indexOf('//');
      if (cut < 0) tx.textContent = line;
      else tx.append(line.slice(0, cut), el('span', 'cm', line.slice(cut)));
      li.append(el('span', 'ln', String(no)), tx);
      if (ran.has(no)) {
        li.classList.add('run');
        li.tabIndex = 0;
        const jump = () => { stop(); setStep(t.steps.findIndex((s) => s.exec === no)); };
        li.addEventListener('click', jump);
        li.addEventListener('keydown', (e) => { if (e.key === 'Enter') { jump(); e.preventDefault(); } });
      }
      code.append(li);
    });
  }

  function buildRegs(t, marks) {
    const body = $('regBody');
    body.replaceChildren();
    t.regs.forEach((r) => {
      const tr = el('tr');
      const th = el('th', '', r.name);
      th.scope = 'row';
      tr.append(th, el('td', 'val'));
      for (let b = 7; b >= 0; b--) {
        const td = el('td');
        const bit = el('span', 'bit');
        if (!((r.mask >> b) & 1)) { bit.classList.add('none'); bit.textContent = '-'; bit.title = `${r.name} のビット ${b} は無い`; }
        else bit.title = `${bitName(r, b)}（ビット ${b}）`;
        if (marks.some((m) => m.reg === r.name && m.bit === b)) bit.classList.add('mark');
        td.append(bit);
        tr.append(td);
      }
      body.append(tr);
    });
  }

  function buildFoot(t, extra) {
    const hz = instrHz(t);
    const lines = [
      `レジスタの値と実行の順番は、MPLAB X ${t.tools.mplabx || ''} のシミュレータ（mdb）で ${t.source_name} を実行して読んだ値（コンパイラ XC8 ${t.tools.xc8 || ''}、記録 ${t.traced}）。`,
      `ピン番号とビットの有無は Microchip のデバイス定義ファイル（${t.pack.name} ${t.pack.version}）から。`,
      hz ? `時間は命令サイクル数を 1 秒あたり ${hz / 1e6} M 命令（Fosc ${t.fosc_hz / 1e6} MHz の 4 分の 1）で割った値。` : '',
      t.fast_forward ? `早送り: __delay_ms の待ちを 1/${t.fast_forward} に縮めた版をシミュレータで動かし、縮めた時間はプログラムの中で数えて足している。命令サイクル数は縮めた後の値。` : '',
      ...extra,
      `作成: ${D.tool}`,
    ].filter(Boolean);
    $('foot').replaceChildren(...lines.map((s) => el('li', '', s)));
  }

  function ctxBase(t) {
    return { t, cfg: t.circuit, box: $('cirBox'), opts: S.opts, U: PV.util };
  }

  function buildTarget() {
    const t = tgt();
    const c = circuitOf(t);
    S.step = Math.min(S.step, last());
    $('slider').max = String(last());
    $('srcName').textContent = t.source_name;
    $('subtitle').textContent = t.summary
      ? `${t.device}: ${t.summary}`
      : `${t.device} の ${t.source_name} を MPLAB X のシミュレータで実行した記録。`;
    buildSource(t);
    buildOptions(c);
    $('cirTitle').textContent = c.title || '回路';
    $('cirBox').replaceChildren();
    const info = c.setup(ctxBase(t)) || {};
    buildRegs(t, info.marks || []);
    $('cirSub').textContent = info.sub || '';
    $('cirAssume').textContent = info.assume || '';
    const counterHint = t.counters.length ? `${t.counters.join('、')} は数え続けるカウンタなので、変化の印を付けない。` : '';
    $('regHint').textContent = ['オレンジの枠は直前のステップから変わったビット。- はそのマイコンに無いビット。', info.regHint || '', counterHint]
      .filter(Boolean).join(' ');
    buildFoot(t, info.foot || []);
    update();
  }

  // seconds since reset; with fast_forward, the waits cut from __delay_ms are added back
  const secondsOf = (t, st) => {
    const hz = instrHz(t);
    return hz ? st.cycles / hz + (st.skipped_us || 0) / 1e6 : null;
  };
  const levelText = (v) => (v === 'high' ? '1' : v === 'low' ? '0' : v);

  // ---------------- per-step painting
  function explain(t, st, prev) {
    const regsChanged = [];
    if (prev) t.regs.forEach((r, i) => { if (!isCounter(t, r.name) && prev.v[i] !== st.v[i]) regsChanged.push(`${r.name} ${hex(prev.v[i])} から ${hex(st.v[i])}`); });
    const inputs = st.inputs
      ? `入力を変えた: ${Object.entries(st.inputs).map(([p, v]) => `${p} = ${levelText(v)}`).join('、')}${st.input_note ? `（${st.input_note}）` : ''}。`
      : '';
    if (st.exec === null) {
      $('exNo').textContent = '';
      $('exCode').textContent = 'まだ無い';
      $('exNote').textContent = inputs + 'リセット直後。main の最初の行はまだ実行していない。';
    } else {
      $('exNo').textContent = `${st.exec} 行目`;
      $('exCode').textContent = codeOf(t.source[st.exec - 1] || '');
      const repeat = prev && prev.exec === st.exec && regsChanged.length === 0;
      const bits = changedBits(t, st, prev);
      const auto = bits.length ? '変わったビット: ' + bits.map((b) => `${b.name} が ${b.from} から ${b.to}`).join('、') : 'レジスタの変化は無い。';
      let note;
      if (st.kind === 'end') note = t.notes[String(st.exec)] || `${st.exec} 行目に来たので、${st.watch} への書き込みを追うのを終える。`;
      else if (repeat) note = '同じ行をもう一度実行した（ループの中）。レジスタは変わらない。';
      else note = t.notes[String(st.exec)] || auto;
      if (st.kind === 'write') note = `${st.watch} に書いた所で止めた。` + note;
      $('exNote').textContent = inputs + note;
    }
    $('exDelta').textContent = prev ? (regsChanged.length ? `変わったレジスタ: ${regsChanged.join('、')}` : '変わったレジスタ: なし') : '';
    $('exDelta').className = regsChanged.length ? 'delta' : '';
    const sec = secondsOf(t, st);
    const time = sec === null ? '' : t.fast_forward
      ? `（早送りで縮めた待ちを足すと ${fmtTime(sec)}）`
      : `（${fmtTime(sec)}）`;
    $('exMeta').textContent = `次に実行する行: ${st.next} 行目（アドレス ${st.addr}）　リセットからの命令サイクル数: ${st.cycles}${time}`;
  }

  function paintSource(st) {
    const code = $('code');
    code.querySelectorAll('li').forEach((li) => li.classList.toggle('cur', Number(li.dataset.line) === st.exec));
    const cur = code.querySelector('li.cur');
    if (cur && code.scrollHeight > code.clientHeight) {   // keep the executed line inside the listing's own scroll box
      const box = code.getBoundingClientRect();
      const row = cur.getBoundingClientRect();
      const margin = row.height * 2;
      if (row.top < box.top + margin) code.scrollTop -= box.top + margin - row.top;
      else if (row.bottom > box.bottom - margin) code.scrollTop += row.bottom - (box.bottom - margin);
    }
  }

  function paintRegs(t, st, prev) {
    [...$('regBody').rows].forEach((tr, i) => {
      const r = t.regs[i];
      const v = st.v[i];
      const pv = prev ? prev.v[i] : v;
      const counter = isCounter(t, r.name);
      tr.classList.toggle('chg', pv !== v && !counter);
      tr.cells[1].textContent = hex(v);
      tr.cells[1].title = pv !== v ? `直前の値は ${hex(pv)}` : '';
      for (let b = 7; b >= 0; b--) {
        const bit = tr.cells[2 + (7 - b)].firstChild;
        if (!((r.mask >> b) & 1)) continue;
        const one = (v >> b) & 1;
        bit.textContent = String(one);
        bit.classList.toggle('one', one === 1);
        bit.classList.toggle('flip', ((pv ^ v) >> b & 1) === 1 && !counter);
      }
    });
  }

  function paintStatus(list) {
    $('cirStatus').replaceChildren(...list.map((s) => {
      const d = el('div', s.tone || '');
      d.append(el('dt', '', s.label), el('dd', '', s.value));
      return d;
    }));
  }

  function waveCaption(w, hz) {
    const range = (a) => (Math.min(...a) === Math.max(...a) ? `${a[0]}` : `${Math.min(...a)}〜${Math.max(...a)}`);
    const avg = (a) => a.reduce((s, x) => s + x, 0) / a.length;
    const parts = [];
    if (w.periods.length) parts.push(`周期 ${range(w.periods)} サイクル` + (hz ? `（約 ${num(hz / avg(w.periods) / 1000)} kHz）` : ''));
    if (w.highs.length) parts.push(`H の長さ ${range(w.highs)} サイクル`);
    if (w.periods.length && w.highs.length) parts.push(`デューティ 約 ${Math.round((avg(w.highs) / avg(w.periods)) * 100)} %`);
    else parts.push(`この間ずっと ${w.edges[0][1] ? 'H' : 'L'}` );
    return parts.join('、') + '。1 命令は 1〜2 サイクルなので、変わり目の位置は 1〜2 サイクルずれうる。';
  }

  function paintWaves(t, st) {
    const box = $('waveBox');
    const list = (t.waves || []).filter((w) => w.at === st.next);
    box.hidden = list.length === 0;
    box.replaceChildren();
    const hz = instrHz(t);
    list.forEach((w) => {
      const W = 600, H = 40, hi = 5, lo = H - 5;
      const span = Math.max(1, w.end - w.start);
      const x = (c) => (((c - w.start) / span) * W).toFixed(1);
      const pts = [];
      w.edges.forEach(([c, lv], i) => {
        if (i > 0) pts.push(`${x(c)},${w.edges[i - 1][1] ? hi : lo}`);
        pts.push(`${x(c)},${lv ? hi : lo}`);
      });
      pts.push(`${W},${w.edges[w.edges.length - 1][1] ? hi : lo}`);
      const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', role: 'img', 'aria-label': `${w.pin} の波形` });
      svg.append(svgEl('polyline', { points: pts.join(' ') }));
      const card = el('div', 'wave');
      card.append(el('p', 'head', `${w.pin} の実際の波形: シミュレータで ${w.at} 行目に止めてから ${w.samples} 命令、1 命令ずつピンを読んだ（${w.end - w.start} サイクル分）`),
        svg, el('p', 'cap', waveCaption(w, hz)));
      box.append(card);
    });
  }

  function update() {
    const t = tgt();
    const st = t.steps[S.step];
    const prev = S.step > 0 ? t.steps[S.step - 1] : null;
    $('slider').value = String(S.step);
    $('stepLabel').textContent = `ステップ ${S.step} / ${last()}`;
    $('bFirst').disabled = $('bPrev').disabled = S.step === 0;
    $('bNext').disabled = $('bLast').disabled = S.step === last();
    explain(t, st, prev);
    paintSource(st);
    paintRegs(t, st, prev);
    const res = circuitOf(t).update({ ...ctxBase(t), st, prev, k: S.step, R: regsAt(t, st), P: prev ? regsAt(t, prev) : null,
      regsAt: (step) => regsAt(t, step), fmtTime, instrHz: instrHz(t), seconds: secondsOf(t, st) }) || {};
    paintStatus(res.status || []);
    $('cirText').textContent = res.text || '';
    S.probe = res.probe || null;
    paintWaves(t, st);
    writeHash(t);
  }

  // ---------------- state, hash and controls
  function writeHash(t) {
    const p = new URLSearchParams({ target: t.id, step: String(S.step) });
    (circuitOf(t).options || []).forEach((o) => p.set(o.key, S.opts[o.key]));
    try { history.replaceState(null, '', '#' + p.toString()); } catch (e) { /* file:// may refuse */ }
  }
  function readHash() {
    const p = new URLSearchParams(location.hash.slice(1));
    const i = D.targets.findIndex((t) => t.id === p.get('target'));
    if (i >= 0) S.t = i;
    const n = Number.parseInt(p.get('step'), 10);
    if (Number.isFinite(n)) S.step = Math.max(0, n);
    for (const [k, v] of p.entries()) if (k !== 'target' && k !== 'step') S.opts[k] = v;
  }
  function setStep(n) { S.step = Math.max(0, Math.min(last(), n)); update(); }
  function stop() {
    if (S.timer) clearInterval(S.timer);
    S.timer = null;
    $('bPlay').textContent = '再生';
    $('bPlay').setAttribute('aria-pressed', 'false');
  }
  function play() {
    if (S.step >= last()) setStep(0);
    S.timer = setInterval(() => { if (S.step >= last()) stop(); else setStep(S.step + 1); }, PLAY_MS);
    $('bPlay').textContent = '停止';
    $('bPlay').setAttribute('aria-pressed', 'true');
  }

  $('bFirst').addEventListener('click', () => { stop(); setStep(0); });
  $('bPrev').addEventListener('click', () => { stop(); setStep(S.step - 1); });
  $('bNext').addEventListener('click', () => { stop(); setStep(S.step + 1); });
  $('bLast').addEventListener('click', () => { stop(); setStep(last()); });
  $('bPlay').addEventListener('click', () => { if (S.timer) stop(); else play(); });
  $('slider').addEventListener('input', (e) => { stop(); setStep(Number(e.target.value)); });
  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;   // the slider and the radios keep their own keys
    if (e.key === 'ArrowRight') { stop(); setStep(S.step + 1); }
    else if (e.key === 'ArrowLeft') { stop(); setStep(S.step - 1); }
    else if (e.key === 'Home') { stop(); setStep(0); }
    else if (e.key === 'End') { stop(); setStep(last()); }
    else if (e.key === ' ' && tag !== 'BUTTON' && tag !== 'LI') { if (S.timer) stop(); else play(); }
    else return;
    e.preventDefault();
  });

  // read-only view of the state, for checks run from a browser driver
  PV.state = () => {
    const t = tgt();
    const st = t.steps[S.step];
    return { target: t.id, step: S.step, last: last(), exec: st.exec, next: st.next, kind: st.kind,
      opts: { ...S.opts }, playing: Boolean(S.timer), probe: S.probe };
  };

  readHash();
  document.title = D.title;
  $('title').textContent = D.title;
  buildTargets();
  buildTarget();
})();

</script>
</body>
</html>
