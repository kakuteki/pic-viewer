name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install .
      - name: command line
        run: |
          picviewer --version
          picviewer --help
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: the example pages are what render makes
        run: |
          picviewer render examples/led
          picviewer render examples/motor
          git diff --exit-code -- examples
